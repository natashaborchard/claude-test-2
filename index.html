<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Media Library (Snapshot)</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--bd:#e2e2dc;--ac:#2f5bea;--acx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#212120;--tx:#ecece8;--mu:#9a9a94;--bd:#33332f;--ac:#7b9bff;--acx:#10101a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--card:#212120;--tx:#ecece8;--mu:#9a9a94;--bd:#33332f;--ac:#7b9bff;--acx:#10101a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:960px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
input,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;width:100%}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:5px 12px;font-size:13px}
button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.bar{display:flex;gap:8px;flex-wrap:wrap}.bar input{flex:1 1 240px}.bar select{width:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}.meta{color:var(--mu);font-size:12px}
.crumb{border:0;background:none;color:var(--ac);padding:2px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:16px;overflow-wrap:anywhere}.card a{color:var(--ac);text-decoration:none}
.type{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
mark{background:rgba(255,200,0,.35);color:inherit;border-radius:3px}
.empty{text-align:center;color:var(--mu);padding:40px 0;grid-column:1/-1}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 12px}summary{cursor:pointer;font-weight:500}details .row{margin:8px 0}
</style></head><body><main>
<h1>🗂️ Team Media Library</h1><div class="sub" id="stamp"></div>
<div class="bar"><input id="q" type="search" placeholder="Search by keyword, title or description…">
<select id="tf"><option value="">All types</option><option>Image</option><option>Video</option><option>Document</option><option>Audio</option><option>Other</option></select></div>
<div class="row" id="crumbs"></div><div class="row" id="folders"></div><div class="row" id="tagbar"></div>
<div class="meta" id="count"></div><div class="grid" id="grid"></div>
</main>
<script>
const DATA={"generated": 1793906616592, "items": [{"addedAt": 1793584000000, "by": "", "desc": "Imported from the Google Drive folder “Claude Test”.", "folder": "", "keywords": ["wolgemuth gelinas", "westchester country club", "2026"], "tags": [], "title": "Wolgemuth Gelinas Westchester Country Club 2026", "type": "Video", "url": "https://drive.google.com/file/d/13NhFXO-GucxnKyQWhtkbhanumzobH8ev/view?usp=drivesdk", "id": "drive-13NhFXO-Guc"}, {"addedAt": 1793630000000, "by": "", "desc": "Imported from the Google Drive folder “Claude Test”.", "folder": "", "keywords": ["berkowitz", "gotham hall", "2019", "sax"], "tags": ["Sax"], "title": "Berkowitz Gotham Hall 2019 Sax", "type": "Video", "url": "https://drive.google.com/file/d/1EbFjsnhvqxLLStpj30vhMbFAGEm6MAaI/view?usp=drivesdk", "id": "drive-1EbFjsnhvqx"}, {"addedAt": 1793580000000, "by": "", "desc": "Imported from the Google Drive folder “Claude Test”.", "keywords": ["weiland", "wedding", "private residence", "2026", "tnm", "pink pony club"], "tags": ["Pop", "TNM"], "title": "Weiland Wedding Private Residence 2026 TNM Pink Pony Club", "type": "Video", "url": "https://drive.google.com/file/d/1URIdVi2ort-JClj5wErHxjMQu2GJPc_D/view?usp=drivesdk", "id": "drive-1URIdVi2ort", "folder": ""}, {"addedAt": 1793580002000, "by": "", "desc": "Imported from the Google Drive folder “Claude Test”.", "keywords": ["robinson horowitz", "blue hill", "2026", "sax"], "tags": ["Sax"], "title": "Robinson Horowitz Blue Hill 2026 Sax Party", "type": "Video", "url": "https://drive.google.com/file/d/1flDXVMXv3YMzJr90vAfBOe8o9eo6ur37/view?usp=drivesdk", "id": "drive-1flDXVMXv3Y", "folder": ""}, {"addedAt": 1793581000000, "by": "", "desc": "Imported from the Google Drive folder “Claude Test”.", "keywords": ["fournier duggan", "sweet caroline"], "tags": ["ClassicRock/Oldies"], "title": "Fournier Duggan Sweet Caroline", "type": "Video", "url": "https://drive.google.com/file/d/1r9LcEG4HVXaG0ai7AXwvKb56FTuZiPiV/view?usp=drivesdk", "id": "drive-1r9LcEG4HVX", "folder": ""}, {"addedAt": 1793580001000, "by": "", "desc": "Imported from the Google Drive folder “Claude Test”.", "folder": "", "keywords": ["han seo", "cedar lakes", "2026", "tnm", "i wanna be where you are", "crowd"], "tags": [], "title": "Han Seo Cedar Lakes 2026 TNM I Wanna Be Where You Are Crowd", "type": "Video", "url": "https://drive.google.com/file/d/1vI13TshtEkRJjwYI-W2mMCAWiRXDdBzS/view?usp=drivesdk", "id": "drive-1vI13TshtEk"}], "folders": [], "tags": [{"group": "Artists", "name": "Ben", "id": "tag-artist-ben"}, {"group": "Artists", "name": "Chauncey", "id": "tag-artist-chauncey"}, {"group": "Artists", "name": "Clare", "id": "tag-artist-clare"}, {"group": "Artists", "name": "Daron", "id": "tag-artist-daron"}, {"group": "Artists", "name": "Devin", "id": "tag-artist-devin"}, {"group": "Artists", "name": "Julia", "id": "tag-artist-julia"}, {"group": "Artists", "name": "Syndee", "id": "tag-artist-syndee"}, {"group": "Artists", "name": "Xaxa", "id": "tag-artist-xaxa"}, {"group": "Artists", "name": "Yvette", "id": "tag-artist-yvette"}, {"group": "Artists", "name": "Zack Z", "id": "tag-artist-zack-z"}, {"group": "Bands", "name": "Beat Boutique", "id": "tag-band-beat-boutique"}, {"group": "Bands", "name": "Ben & Friends", "id": "tag-band-ben-and-friends"}, {"group": "Bands", "name": "Clare & Co", "id": "tag-band-clare-and-co"}, {"group": "Bands", "name": "ECMWC", "id": "tag-band-ecmwc"}, {"group": "Bands", "name": "HipHop Violinist", "id": "tag-band-hiphop-violinist"}, {"group": "Bands", "name": "Jazz w/ a Twist", "id": "tag-band-jazz-with-a-twist"}, {"group": "Bands", "name": "Regency Strings", "id": "tag-band-regency-strings"}, {"group": "Bands", "name": "Retro Jukebox", "id": "tag-band-retro-jukebox"}, {"group": "Bands", "name": "Sax to Tracks", "id": "tag-band-sax-to-tracks"}, {"group": "Bands", "name": "Social Hour", "id": "tag-band-social-hour"}, {"group": "Bands", "name": "Souled Out", "id": "tag-band-souled-out"}, {"group": "Bands", "name": "The Nomadics", "id": "tag-band-the-nomadics"}, {"group": "Bands", "name": "TNM", "id": "tag-band-tnm"}, {"group": "Genres", "name": "ClassicRock/Oldies", "id": "tag-classicrock-oldies"}, {"group": "Genres", "name": "Country", "id": "tag-country"}, {"group": "Genres", "name": "Crooner", "id": "tag-crooner"}, {"group": "Genres", "name": "Current", "id": "tag-current"}, {"group": "Decades", "name": "1960s", "id": "tag-decade-1960s"}, {"group": "Decades", "name": "1970s", "id": "tag-decade-1970s"}, {"group": "Decades", "name": "1980s", "id": "tag-decade-1980s"}, {"group": "Decades", "name": "1990s", "id": "tag-decade-1990s"}, {"group": "Decades", "name": "2000s", "id": "tag-decade-2000s"}, {"group": "Decades", "name": "2010s", "id": "tag-decade-2010s"}, {"group": "Decades", "name": "2020s", "id": "tag-decade-2020s"}, {"group": "Genres", "name": "Disco", "id": "tag-disco"}, {"group": "Genres", "name": "EDM", "id": "tag-edm"}, {"group": "Genres", "name": "Indie/Rock", "id": "tag-indie-rock"}, {"group": "Genres", "name": "Jazz", "id": "tag-jazz"}, {"group": "Genres", "name": "Latin", "id": "tag-latin"}, {"group": "Genres", "name": "Motown/Funk/Soul", "id": "tag-motown-funk-soul"}, {"group": "Genres", "name": "Pop", "id": "tag-pop"}, {"group": "Genres", "name": "RnB/HipHop/Rap", "id": "tag-rnb-hiphop-rap"}, {"group": "Artists", "name": "Alle", "id": "tmw3nca5bmg5"}, {"group": "Artists", "name": "Ziarra", "id": "tmw3ne0s26bk"}, {"group": "Instruments", "name": "Sax", "id": "tmw3nis5y1eg"}, {"group": "Instruments", "name": "Piano", "id": "tmw3nivqhv38"}, {"group": "Instruments", "name": "Acousitc Guitar", "id": "tmw3njbosqui"}, {"group": "Instruments", "name": "Bass", "id": "tmw3njo3mz0v"}], "groups": [{"name": "Genres", "order": 0, "id": "group-genres"}, {"name": "Artists", "order": 1, "id": "group-artists"}, {"name": "Decades", "order": 2, "id": "group-decades"}, {"name": "Bands", "order": 3, "id": "group-bands"}, {"name": "Instruments", "order": 4, "id": "group-instruments"}]};
const items=DATA.items,folders=DATA.folders;let tag="",cur="";const openG=new Set();
const $=id=>document.getElementById(id);
$("stamp").textContent="Snapshot from "+new Date(DATA.generated).toLocaleDateString()+" · read-only";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u)?u:"#";
function path(id){const p=[];let f=folders.find(x=>x.id===id),n=0;while(f&&n++<20){p.unshift(f);f=folders.find(x=>x.id===f.parent)}return p}
function hl(t,ts){let h=esc(t);ts.forEach(x=>{h=h.replace(new RegExp("("+x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>")});return h}
function render(){
  const ts=$("q").value.toLowerCase().split(/\s+/).filter(Boolean),tf=$("tf").value,s=!!(ts.length||tag||tf);
  const hits=items.filter(i=>(s||(i.folder||"")===cur)&&(!tf||i.type===tf)&&(!tag||(i.tags||[]).includes(tag))&&ts.every(t=>[i.title,i.desc,i.type,(i.keywords||[]).join(" "),(i.tags||[]).join(" ")].join(" ").toLowerCase().includes(t))).sort((a,b)=>(b.addedAt||0)-(a.addedAt||0));
  $("crumbs").innerHTML=s||(!cur&&!folders.length)?"":`<button class="crumb" data-f="">All media</button>`+path(cur).map(f=>` / <button class="crumb" data-f="${esc(f.id)}">${esc(f.name)}</button>`).join("");
  $("folders").innerHTML=s?"":folders.filter(f=>(f.parent||"")===cur).sort((a,b)=>a.name.localeCompare(b.name)).map(f=>`<button data-f="${esc(f.id)}">📁 ${esc(f.name)} ${items.filter(i=>(i.folder||"")===f.id).length}</button>`).join("");
  const freq={};items.filter(i=>!tf||i.type===tf).forEach(i=>(i.tags||[]).forEach(t=>freq[t]=(freq[t]||0)+1));
  const known=new Set(DATA.tags.map(t=>t.name)),other=Object.keys(freq).filter(t=>!known.has(t)).map(n=>({name:n,group:"Other"}));
  const all=DATA.tags.concat(other),gl=DATA.groups.map(g=>g.name).concat(other.length?["Other"]:[]);
  $("tagbar").innerHTML=gl.map(g=>{const l=all.filter(t=>(t.group||"Other")===g).sort((x,y)=>x.name.localeCompare(y.name));if(!l.length)return"";
    return `<details data-g="${esc(g)}"${(openG.has(g)||l.some(t=>t.name===tag))?" open":""}><summary>${esc(g)}</summary><div class="row">${l.map(t=>`<button class="${t.name===tag?"on":""}" data-t="${esc(t.name)}">${esc(t.name)} ${freq[t.name]||0}</button>`).join("")}</div></details>`}).join("")+(tag?`<button data-t="">Clear ✕</button>`:"");
  $("count").textContent=`${hits.length} of ${items.length} items`;
  $("grid").innerHTML=hits.length?hits.map(i=>`<div class="card"><span class="type">${esc(i.type)}</span><h3><a href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener noreferrer">${hl(i.title,ts)}</a></h3>
  ${i.desc?`<div class="meta">${hl(i.desc,ts)}</div>`:""}
  <div class="row" style="margin:0">${(i.tags||[]).map(t=>`<button data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>
  ${s&&i.folder?`<div class="meta">📁 ${esc(path(i.folder).map(f=>f.name).join(" / "))}</div>`:""}</div>`).join(""):`<div class="empty">${s?"No matches. Try fewer or different keywords.":"This folder has no items yet."}</div>`;
}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.f!==undefined){cur=b.dataset.f;render()}
  else if(b.dataset.t!==undefined){tag=b.dataset.t===tag?"":b.dataset.t;render()}});
$("tagbar").addEventListener("toggle",e=>{const g=e.target.dataset&&e.target.dataset.g;if(g){e.target.open?openG.add(g):openG.delete(g)}},true);
$("q").oninput=render;$("tf").onchange=render;render();
</script></body></html>
